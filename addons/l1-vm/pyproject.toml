[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "polmon-l1-vm"
version = "0.1.0rc2"
description = "Experimental optional QEMU/KVM L1 runtime for POLMON"
requires-python = ">=3.12,<3.13"
dependencies = ["polmon==0.7.0rc2"]

[project.scripts]
polmon-l1-vm = "polmon_l1_vm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polmon_l1_vm"]
