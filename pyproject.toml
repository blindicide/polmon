[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "polmon"
version = "0.4.1"
description = "Resource-efficient isolated network attack simulation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "polmon contributors"}]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  # Transitive via FastAPI; pinned explicitly so the audited version is visible (see SECURITY.md).
  "starlette==1.7.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-qt==4.5.0",
  "ruff==0.8.6",
]
# Qt desktop client (LGPLv3). Essentials = QtCore/QtGui/QtWidgets; see RESOURCE-BUDGET.md.
gui = ["PySide6-Essentials==6.11.2", "shiboken6==6.11.2"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.7"]

[project.scripts]
polmon-backend = "polmon.backend:main"
polmon-benchmark = "polmon.benchmarks.cli:main"
polmon-client = "polmon.client.app:main"
polmon-demo = "polmon.demo:main"
polmon-diagnostics = "polmon.core.diagnostics:main"
polmon-topology = "polmon.topology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polmon"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: integration tests",
  "privileged: requires authorized laboratory networking privileges",
  "performance: explicit performance tests",
  "smoke: smoke tests",
  "gui: drives the Qt client (pytest-qt); xvfb-run on Linux CI, offscreen platform on Windows",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
