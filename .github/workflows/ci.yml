name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check .
      - name: Check helper script syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Smoke every entry point
        run: |
          for command in polmon-backend polmon-client polmon-diagnostics polmon-topology \
                         polmon-benchmark polmon-demo; do
            output="$("$command" --version)"
            echo "$command: $output"
            test "$output" = "polmon $(python -c 'from polmon.version import __version__; print(__version__)')"
          done
      - run: pytest -m "not privileged and not performance" --cov=polmon --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Small rootless benchmark (10/25 L0 endpoints)
        run: pytest -m "performance and not privileged" -p no:cacheprovider
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f test-results.xml ]]; then
            python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml').getroot(); print(f\"Tests: {r.attrib.get('tests', '0')}, failures: {r.attrib.get('failures', '0')}, errors: {r.attrib.get('errors', '0')}, skipped: {r.attrib.get('skipped', '0')}\")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No JUnit report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-test-results
          path: |
            test-results.xml
            coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev,build]"
      # The auditor is installed separately and never becomes a project dependency.
      - run: python -m pip install --disable-pip-version-check "pip-audit==2.9.0"
      - name: Audit pinned dependencies for known vulnerabilities
        run: pip-audit --skip-editable --progress-spinner off
