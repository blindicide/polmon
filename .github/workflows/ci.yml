name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libegl1 \
            libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev,gui]"
      - run: ruff check .
      # The UI must not bypass the catalogs, and both catalogs must be complete and consistent.
      - name: Translation gates (hard-coded literals, catalog completeness)
        run: |
          python scripts/i18n-lint.py | tee i18n-lint.txt
          python scripts/i18n-completeness.py | tee i18n-completeness.txt
          grep -q "i18n-completeness: PASS" i18n-completeness.txt
          grep -q ", 0 hard-coded user-facing literal(s)" i18n-lint.txt
      - name: Check helper script syntax
        if: runner.os == 'Linux'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Smoke every entry point
        run: |
          expected="polmon $(python -c 'from polmon.version import __version__; print(__version__)')"
          for command in polmon-backend polmon-client polmon-diagnostics polmon-topology \
                         polmon-benchmark polmon-demo; do
            output="$("$command" --version | tr -d '\r')"
            echo "$command: $output"
            test "$output" = "$expected"
          done
          polmon-client --self-test
      - name: Unit and integration tests (rootless, no GUI)
        run: >
          pytest -m "not privileged and not performance and not gui" -p no:cacheprovider
          --cov=polmon --cov-report= --junitxml=results-unit.xml
      # The suite runs in Russian (the default UI language) and again in English.
      - name: GUI tests (pytest-qt, Xvfb, platform xcb)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a pytest -m gui -p no:cacheprovider --cov=polmon --cov-append
          --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=results-gui.xml
      - name: GUI tests in English (Xvfb, platform xcb)
        if: runner.os == 'Linux'
        env:
          POLMON_LANGUAGE: en
        run: xvfb-run -a pytest -m gui -p no:cacheprovider --junitxml=results-gui-en.xml
      # --no-qt-log: on Windows runners pytest's output capture combined with pytest-qt's Qt
      # message capture aborts the interpreter (either one alone is fine; see CI.md).
      - name: GUI tests (pytest-qt, offscreen platform)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          pytest -m gui -p no:cacheprovider --no-qt-log --cov=polmon --cov-append
          --cov-report=xml:coverage.xml --junitxml=results-gui.xml
      - name: GUI tests in English (offscreen platform)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          POLMON_LANGUAGE: en
        run: pytest -m gui -p no:cacheprovider --no-qt-log --junitxml=results-gui-en.xml
      - name: Qt client on the native platform (smoke start)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a polmon-client --smoke-start 3 | tee smoke.txt
            grep -q "smoke-start: PASS platform=xcb" smoke.txt
          else
            polmon-client --smoke-start 3 | tee smoke.txt
            grep -q "smoke-start: PASS platform=windows" smoke.txt
          fi
      - name: Small rootless benchmark (10/25 L0 endpoints)
        if: runner.os == 'Linux'
        run: pytest -m "performance and not privileged" -p no:cacheprovider --junitxml=results-perf.xml
      - name: Publish test summary
        if: always()
        run: |
          files=(results-unit.xml results-gui.xml results-gui-en.xml)
          [[ "$RUNNER_OS" == "Linux" ]] && files+=(results-perf.xml)
          python scripts/ci_summary.py "Tests on ${{ matrix.os }}" --coverage coverage.xml \
            "${files[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            results-*.xml
            coverage.xml
            i18n-*.txt
          if-no-files-found: warn

  screenshots:
    name: UI screenshots (real renders)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxcb-cursor0 libxkbcommon-x11-0 \
            libegl1 libfontconfig1 fonts-dejavu-core
      - run: python -m pip install -e ".[gui]"
      - name: Render every page from the running client against a real backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/ui_screenshots.py --output ui-screenshots
          python scripts/ui_screenshots.py --output ui-screenshots/en --language en --no-benchmark
      - name: Live end-to-end demonstration through the client (rootless workload)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ui_e2e.py --output-dir ui-screenshots/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,gui,build]"
      # The auditor is installed separately and never becomes a project dependency.
      - run: python -m pip install "pip-audit==2.9.0"
      - name: Audit pinned dependencies for known vulnerabilities
        run: pip-audit --skip-editable --progress-spinner off
