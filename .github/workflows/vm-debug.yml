name: VM debug (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/vm-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          python -m venv .venv && .venv/bin/python -m pip install -q -e ".[dev]"
          PYTHONPATH=addons/l1-vm/src .venv/bin/python -m polmon_l1_vm.cli acquire-image --manifest examples/vm/alpine-3.24.1-manifest.json --image "$RUNNER_TEMP/alpine.qcow2"
      - name: Inspect the image
        run: |
          sudo modprobe nbd max_part=8
          sudo qemu-nbd -r -c /dev/nbd0 "$RUNNER_TEMP/alpine.qcow2"
          sleep 2
          sudo mkdir -p /mnt/img
          for p in /dev/nbd0p1 /dev/nbd0p2 /dev/nbd0; do sudo mount -o ro $p /mnt/img 2>/dev/null && break; done
          echo "--- initramfs virtio/sd modules"
          sudo zcat /mnt/img/boot/initramfs-virt | cpio -t 2>/dev/null | grep -E "virtio_blk|virtio_scsi|virtio_pci|sd_mod|ata_piix|ahci|ext4|virtio_net" | head -20
          echo "--- mkinitfs.conf"; sudo cat /mnt/img/etc/mkinitfs/mkinitfs.conf
          echo "--- cloud-init"; ls /mnt/img/usr/bin/cloud-init /mnt/img/etc/cloud/cloud.cfg 2>&1; sudo grep -n "datasource" /mnt/img/etc/cloud/cloud.cfg | head
          echo "--- openrc default runlevel"; ls /mnt/img/etc/runlevels/default /mnt/img/etc/runlevels/boot 2>&1 | head -40
          sudo umount /mnt/img; sudo qemu-nbd -d /dev/nbd0
      - name: Boot twice with full serial capture (virtio disk vs IDE disk)
        run: |
          mkdir -p seed && printf 'instance-id: dbg\nlocal-hostname: dbg\n' > seed/meta-data
          printf '#cloud-config\nhostname: dbg\n' > seed/user-data
          genisoimage -quiet -output seed.iso -volid cidata -joliet -rock seed
          for variant in virtio ide; do
            qemu-img create -q -f qcow2 -F qcow2 -b "$RUNNER_TEMP/alpine.qcow2" "$variant.qcow2"
            if [[ $variant == virtio ]]; then
              disks=(-drive file=$variant.qcow2,if=virtio,format=qcow2 -drive file=seed.iso,if=virtio,format=raw,readonly=on)
            else
              disks=(-drive file=$variant.qcow2,if=ide,index=0,format=qcow2 -drive file=seed.iso,if=ide,index=1,media=cdrom,readonly=on)
            fi
            timeout 75 qemu-system-x86_64 -name dbg -machine pc,accel=kvm -cpu host -m 256 -smp 1 \
              -nodefaults -no-user-config -display none -no-reboot \
              -serial file:$variant.serial "${disks[@]}" || true
            echo "=== $variant: $(wc -c < $variant.serial) bytes; last 25 lines"
            tail -n 25 $variant.serial
            grep -c "login:" $variant.serial || true
          done
