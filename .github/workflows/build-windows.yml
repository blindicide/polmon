name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev,build]"
      - run: ruff check .
      - run: pytest -m "not privileged and not performance"
      - run: pyinstaller --clean --noconfirm packaging/windows/polmon.spec
      - name: Verify executable
        shell: pwsh
        run: |
          $version = python -c "from polmon.version import __version__; print(__version__)"
          $exe = "dist/polmon-$version-windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed: $LASTEXITCODE" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "--self-test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polmon-windows-x64
          path: dist/polmon-*-windows-x64.exe
          if-no-files-found: error
