name: Build Linux

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; empty builds the triggering commit
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; empty builds the selected branch
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-linux-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_LIBS: >-
    libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
    libegl1 libfontconfig1 libdbus-1-3

jobs:
  build-linux:
    # The oldest supported hosted image: the bundle then runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb jq iproute2 iputils-ping \
            sudo util-linux $QT_LIBS
      - run: python -m pip install -e ".[dev,gui,build]"
      - run: ruff check .
      - name: Run tests (rootless, then GUI under Xvfb)
        run: |
          pytest -m "not privileged and not performance and not gui" -p no:cacheprovider
          xvfb-run -a pytest -m gui -p no:cacheprovider
      - name: Build the client, self-contained backend, tarballs and wheel
        run: |
          version="$(python -c 'from polmon.version import __version__; print(__version__)')"
          name="polmon-${version}-linux-x64"
          backend_name="polmon-backend-${version}-linux-x64"
          pyinstaller --clean --noconfirm packaging/linux/polmon-client.spec
          pyinstaller --clean --noconfirm packaging/linux/polmon-backend.spec
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${SOURCE_DATE_EPOCH}" \
            -C dist -cf - "$name" | gzip -n -9 > "dist/${name}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${SOURCE_DATE_EPOCH}" \
            -C dist -cf - "$backend_name" | gzip -n -9 > "dist/${backend_name}.tar.gz"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          (cd dist && sha256sum "${backend_name}.tar.gz" > "${backend_name}.tar.gz.sha256")
          python -m pip wheel --no-deps --wheel-dir dist .
          cp packaging/linux/polmon-backend.service dist/
          cp packaging/linux/polmon-backend-bundled.service dist/
          ls -l dist
          du -sb "dist/$name" "dist/$backend_name"
      - name: Smoke-test the extracted bundle
        run: |
          version="$(python -c 'from polmon.version import __version__; print(__version__)')"
          name="polmon-${version}-linux-x64"
          scratch="$(mktemp -d)"
          tar -xzf "dist/${name}.tar.gz" -C "$scratch"
          client="$scratch/$name/polmon-client"
          test "$(env -i PATH=/usr/bin:/bin "$client" --version)" = "polmon ${version}"
          env -i PATH=/usr/bin:/bin HOME="$scratch" LANG=C.UTF-8 "$client" --self-test | tee selftest.txt
          grep -q "qxcb" selftest.txt && grep -q "self-test: PASS" selftest.txt
          xvfb-run -a "$client" --smoke-start 3 | tee smoke.txt
          grep -q "smoke-start: PASS platform=xcb" smoke.txt
          XDG_DATA_HOME="$scratch/xdg" "$client" --install-desktop-entry
          grep -q "^Exec=$scratch/$name/polmon-client$" "$scratch/xdg/applications/polmon-client.desktop"
          xvfb-run -a python scripts/measure-client.py --runs 3 --idle 10 -- "$client" \
            | tee linux-client-measurements.json
      - name: Prove the extracted backend runs without Python and complete a real L0 workflow
        run: |
          version="$(python -c 'from polmon.version import __version__; print(__version__)')"
          name="polmon-backend-${version}-linux-x64"
          scratch="$(mktemp -d)"
          tar -xzf "dist/${name}.tar.gz" -C "$scratch"
          backend="$scratch/$name/polmon-backend"
          test "$(env -i PATH=/usr/bin:/bin LANG=C.UTF-8 "$backend" --version)" = "polmon ${version}"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$scratch" "$backend" --self-test \
            | tee linux-backend-selftest.txt
          grep -q "PASS uvicorn application graph" linux-backend-selftest.txt
          # Positive run: the hosted runner has passwordless sudo, so L1 really deploys here.
          scripts/packaged-backend-e2e.sh "$backend" linux-backend
          jq -e '.experiment_status == "succeeded"' linux-backend-e2e.json
          # Negative control: the same bundle with no sudo on its PATH must refuse L1 with 422.
          nosudo="$scratch/nosudo-bin"
          mkdir "$nosudo"
          for tool in ip ping setpriv; do ln -s "$(command -v "$tool")" "$nosudo/$tool"; done
          scripts/packaged-backend-e2e.sh "$backend" linux-backend-nosudo "$nosudo"
          jq -e '.readiness.l1_ready == false and .l1_result.error.details.requires == "linux_network_namespaces"' \
            linux-backend-nosudo-e2e.json
          echo "Packaged Linux backend L1 outcome: $(jq -r .l1_outcome linux-backend-e2e.json);" \
            "negative control: $(jq -r .l1_result.error.message linux-backend-nosudo-e2e.json)" \
            >> "$GITHUB_STEP_SUMMARY"
          if find "$scratch/$name" \( -iname '*PySide*' -o -iname '*Qt6*' \) | grep -q .; then
            echo "Qt leaked into the backend bundle" >&2; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: polmon-linux-x64
          path: |
            dist/polmon-*-linux-x64.tar.gz
            dist/polmon-*-linux-x64.tar.gz.sha256
            dist/polmon-*-py3-none-any.whl
            dist/polmon-backend.service
            dist/polmon-backend-bundled.service
          if-no-files-found: error
      # Evidence lives in its own artifact: mixing root files into the one above would make
      # upload-artifact keep the dist/ prefix and break every consumer's flat layout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-backend-evidence
          path: |
            linux-backend-selftest.txt
            linux-backend-readiness.json
            linux-backend-e2e.json
            linux-backend.log
            linux-backend-nosudo-readiness.json
            linux-backend-nosudo-e2e.json
            linux-backend-nosudo.log
            linux-backend-nosudo-measurements.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-client-measurements
          path: linux-client-measurements.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-backend-measurements
          path: linux-backend-measurements.json
          if-no-files-found: error

  verify-linux-artifact:
    needs: build-linux
    # A newer distribution than the build host: proves the bundle is not tied to its builder.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polmon-linux-x64
          path: artifact
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install a display server and Qt's xcb system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb jq iproute2 iputils-ping \
            sudo util-linux $QT_LIBS
      - name: Verify checksum and smoke-test the downloaded bundle on a fresh runner
        working-directory: artifact
        run: |
          sha256sum --check --strict polmon-*-linux-x64.tar.gz.sha256
          tarball="$(ls polmon-[0-9]*-linux-x64.tar.gz)"
          name="${tarball%.tar.gz}"
          version="${name#polmon-}"; version="${version%-linux-x64}"
          tar -xzf "$tarball"
          test "$("./$name/polmon-client" --version)" = "polmon ${version}"
          "./$name/polmon-client" --self-test | tee selftest.txt
          grep -q "self-test: PASS" selftest.txt
          xvfb-run -a "./$name/polmon-client" --smoke-start 3 | tee smoke.txt
          grep -q "smoke-start: PASS platform=xcb" smoke.txt
          backend_tarball="$(ls polmon-backend-*-linux-x64.tar.gz)"
          sha256sum --check --strict "${backend_tarball}.sha256"
          backend_name="${backend_tarball%.tar.gz}"
          tar -xzf "$backend_tarball"
          backend="./$backend_name/polmon-backend"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$PWD" "$backend" --self-test \
            | tee backend-selftest.txt
          "$GITHUB_WORKSPACE/scripts/packaged-backend-e2e.sh" "$backend" backend
          nosudo="$PWD/nosudo-bin"
          mkdir "$nosudo"
          for tool in ip ping setpriv; do ln -s "$(command -v "$tool")" "$nosudo/$tool"; done
          "$GITHUB_WORKSPACE/scripts/packaged-backend-e2e.sh" "$backend" backend-nosudo "$nosudo"
          jq -e '.readiness.l1_ready == false' backend-nosudo-e2e.json
          echo "Downloaded Linux backend L1 outcome: $(jq -r .l1_outcome backend-e2e.json)" \
            >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Linux artifacts verified on a fresh runner"
            echo "| File | Size (bytes) | SHA-256 |"
            echo "|---|---:|---|"
            for file in "$tarball" "$backend_tarball" polmon-*-py3-none-any.whl \
                        polmon-backend.service polmon-backend-bundled.service; do
              echo "| $file | $(stat -c %s "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the extracted bundle as the shipped systemd user unit
        working-directory: artifact
        run: |
          # Installs exactly where polmon-backend-bundled.service expects it, starts it through a
          # real systemd user manager, drives the L0 workflow, then stops it gracefully.
          backend_tarball="$(ls polmon-backend-*-linux-x64.tar.gz)"
          unit="$HOME/.config/systemd/user/polmon-backend-bundled.service"
          mkdir -p "$HOME/polmon-backend" "$HOME/polmon-data" "$HOME/.config/polmon" "$(dirname "$unit")"
          tar -xzf "$backend_tarball" -C "$HOME/polmon-backend" --strip-components=1
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          (umask 077 && printf '%s\n' "$token" > "$HOME/.config/polmon/api-token")
          cp polmon-backend-bundled.service "$unit"
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 100); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.1; done
          systemd-analyze --user verify "$unit"
          systemctl --user daemon-reload
          systemctl --user start polmon-backend-bundled.service
          for _ in $(seq 100); do
            curl -fsS http://127.0.0.1:8080/v1/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          set +e
          "$HOME/polmon-backend/polmon-backend" --lab-readiness > unit-readiness.json
          set -e
          (cd "$GITHUB_WORKSPACE" && scripts/packaged-backend-smoke.sh http://127.0.0.1:8080 \
            "$token" "$OLDPWD/unit-readiness.json" "$OLDPWD/unit-e2e.json") > /dev/null
          jq '{experiment_status, report_status, l1_outcome}' unit-e2e.json
          systemctl --user show polmon-backend-bundled.service -p ActiveState -p MainPID -p ExecMainStartTimestamp
          systemctl --user stop polmon-backend-bundled.service
          test "$(systemctl --user show polmon-backend-bundled.service -p ActiveState --value)" = inactive
          sudo journalctl _SYSTEMD_USER_UNIT=polmon-backend-bundled.service --no-pager -o cat \
            > unit-journal.txt
          tail -5 unit-journal.txt
          grep -q '"event":"shutdown_cleanup"' unit-journal.txt
          if pgrep -f "$HOME/polmon-backend/polmon-backend"; then echo "unit left a process" >&2; exit 1; fi
          echo "Bundled systemd user unit: started, served the L0 workflow (L1: $(jq -r .l1_outcome unit-e2e.json)), stopped cleanly" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Install the wheel into a fresh environment and start the backend
        working-directory: artifact
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --disable-pip-version-check -q polmon-*-py3-none-any.whl
          version="$(ls polmon-*-py3-none-any.whl | sed -E 's/^polmon-([^-]+)-.*/\1/')"
          for command in polmon-backend polmon-diagnostics polmon-topology polmon-benchmark; do
            test "$(/tmp/wheel-env/bin/$command --version)" = "polmon ${version}"
          done
          # The wheel alone (no gui extra) must explain how to get the Qt client.
          if /tmp/wheel-env/bin/polmon-client --self-test 2> missing.txt; then exit 1; fi
          grep -q "polmon\[gui\]" missing.txt
          mkdir -p /tmp/backend-data
          (cd /tmp/backend-data && exec /tmp/wheel-env/bin/polmon-backend --port 18080) \
            > backend.log 2>&1 &
          backend=$!
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18080/v1/health > health.json; then break; fi
            sleep 0.2
          done
          cat health.json
          grep -q "\"version\":\"${version}\"" health.json
          kill -TERM "$backend"
          wait "$backend" || true
          cat backend.log
          grep -q '"event":"shutdown_cleanup"' backend.log
