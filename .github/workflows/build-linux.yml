name: Build Linux
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native package tools and Qt runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends rpm xvfb jq libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev,gui,build]"
      - name: Run rootless quality gate
        run: |
          python -m ruff check .
          QT_QPA_PLATFORM=offscreen python -m pytest -m "not privileged and not performance"
      - name: Build the embedded client, native packages, tarball and wheel
        run: |
          version="$(python -c 'from polmon.version import __version__; print(__version__)')"
          name="polmon-$version-linux-x64"
          epoch="$(git log -1 --format=%ct)"
          pyinstaller --clean --noconfirm packaging/linux/polmon-client.spec \
            2>&1 | tee linux-pyinstaller-build.txt
          QT_QPA_PLATFORM=offscreen python -m polmon.client.icon dist/polmon.png
          python scripts/build-linux-packages.py --bundle "dist/$name" --icon dist/polmon.png \
            --output dist --version "$version" --epoch "$epoch" \
            2>&1 | tee linux-native-package-build.txt
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
            -C dist -cf - "$name" | gzip -n -9 > "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          python -m pip wheel --no-deps --wheel-dir dist .
          dpkg-deb --info dist/polmon-client_*.deb
          dpkg-deb --contents dist/polmon-client_*.deb > deb-contents.txt
          rpm -qip dist/polmon-client-*.rpm
          rpm -qlp dist/polmon-client-*.rpm > rpm-contents.txt
          (cd dist && sha256sum --check --strict SHA256SUMS-packages.txt)
      - name: Exercise embedded L0 and SQLite from the extracted client
        run: |
          version="$(python -c 'from polmon.version import __version__; print(__version__)')"
          scratch="$(mktemp -d)"
          tar -xzf "dist/polmon-$version-linux-x64.tar.gz" -C "$scratch"
          client="$scratch/polmon-$version-linux-x64/polmon-client"
          test ! -e "$scratch/polmon-$version-linux-x64/polmon-backend"
          env -i PATH=/usr/bin:/bin HOME="$scratch" LANG=C.UTF-8 "$client" \
            --polmon-run-embedded-backend --diagnostics > linux-embedded-diagnostics.json
          env -i PATH=/usr/bin:/bin HOME="$scratch" LANG=C.UTF-8 "$client" \
            --local-backend-self-test | tee linux-local-backend.txt
          grep -q 'local-backend self-test: PASS' linux-local-backend.txt
          env -i PATH=/usr/bin:/bin HOME="$scratch" LANG=C.UTF-8 "$client" \
            --self-test | tee linux-client-selftest.txt
          xvfb-run -a "$client" --smoke-start 3 | tee linux-smoke.txt
          grep -q 'smoke-start: PASS platform=xcb' linux-smoke.txt
      - name: Install, exercise, upgrade and remove in clean Debian and RPM environments
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" debian:12.12-slim bash -euc '
            apt-get update -qq
            apt-get install -y -qq /packages/polmon-client_*.deb
            export QT_QPA_PLATFORM=offscreen
            polmon-client --self-test
            polmon-client --local-backend-self-test
            mkdir -p /home/operator/polmon-data /home/operator/.config/polmon
            printf keep > /home/operator/polmon-data/result
            printf keep > /home/operator/.config/polmon/settings
            apt-get install -y -qq --reinstall /packages/polmon-client_*.deb
            polmon-client --local-backend-self-test
            apt-get remove -y -qq polmon-client
            test ! -e /usr/bin/polmon-client
            test "$(cat /home/operator/polmon-data/result)" = keep
            test "$(cat /home/operator/.config/polmon/settings)" = keep
          ' | tee deb-install-evidence.txt
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:44 bash -euc '
            dnf -y -q install /packages/polmon-client-*.rpm
            export QT_QPA_PLATFORM=offscreen
            polmon-client --self-test
            polmon-client --local-backend-self-test
            mkdir -p /home/operator/polmon-data /home/operator/.config/polmon
            printf keep > /home/operator/polmon-data/result
            printf keep > /home/operator/.config/polmon/settings
            rpm -Uvh --replacepkgs /packages/polmon-client-*.rpm
            polmon-client --local-backend-self-test
            dnf -y -q remove polmon-client
            test ! -e /usr/bin/polmon-client
            test "$(cat /home/operator/polmon-data/result)" = keep
            test "$(cat /home/operator/.config/polmon/settings)" = keep
          ' | tee rpm-install-evidence.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: polmon-linux-x64
          path: |
            dist/polmon-*-linux-x64.tar.gz
            dist/polmon-*-linux-x64.tar.gz.sha256
            dist/polmon-*-py3-none-any.whl
            dist/polmon-client_*.deb
            dist/polmon-client-*.rpm
            dist/SHA256SUMS-packages.txt
            dist/package-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package-evidence
          path: |
            deb-contents.txt
            rpm-contents.txt
            deb-install-evidence.txt
            rpm-install-evidence.txt
            linux-embedded-diagnostics.json
            linux-local-backend.txt
            linux-client-selftest.txt
            linux-smoke.txt
            linux-pyinstaller-build.txt
            linux-native-package-build.txt
          if-no-files-found: error
  verify-linux-artifact:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polmon-linux-x64
          path: artifact
      - name: Verify downloaded hashes and embedded backend on a fresh runner
        working-directory: artifact
        run: |
          sha256sum --check --strict SHA256SUMS-packages.txt
          sha256sum --check --strict polmon-*-linux-x64.tar.gz.sha256
          tarball="$(ls polmon-[0-9]*-linux-x64.tar.gz)"
          tar -xzf "$tarball"
          client="./$(basename "$tarball" .tar.gz)/polmon-client"
          "$client" --polmon-run-embedded-backend --diagnostics
          "$client" --local-backend-self-test
          for file in *.deb *.rpm; do
            echo "$file $(stat -c %s "$file") $(sha256sum "$file" | cut -d' ' -f1)"
          done >> "$GITHUB_STEP_SUMMARY"
