name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag; both platforms are built from this tag
        required: true
        type: string
      pytest-deselect:
        description: Space-separated pytest node IDs to deselect on Windows (repairs only)
        required: false
        type: string
        default: ""
      notes:
        description: Text prepended to the generated release notes (explain any repair)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}
      pytest-deselect: ${{ inputs.pytest-deselect }}

  linux:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polmon-windows-x64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polmon-linux-x64
          path: dist
      - name: Verify every asset matches the tag version and its build checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%+*}"
          assets=(
            "polmon-${version}-windows-x64.exe"
            "polmon-${version}-windows-x64-portable.zip"
            "polmon-${version}-linux-x64.tar.gz"
            "polmon-${version}-py3-none-any.whl"
            "polmon-backend.service"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "missing $asset for ${RELEASE_TAG}"; ls -l; exit 1; }
          done
          sha256sum --check --strict "polmon-${version}-linux-x64.tar.gz.sha256"
          sha256sum --check --strict "polmon-${version}-windows-x64.exe.sha256"
          sha256sum --check --strict "polmon-${version}-windows-x64-portable.zip.sha256"
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l "${assets[@]}"
      - name: Create the release with both platforms attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%+*}"
          notes=()
          if [[ -n "$RELEASE_NOTES" ]]; then notes=(--notes "$RELEASE_NOTES"); fi
          gh release create "$RELEASE_TAG" \
            "dist/polmon-${version}-windows-x64.exe" \
            "dist/polmon-${version}-windows-x64-portable.zip" \
            "dist/polmon-${version}-linux-x64.tar.gz" \
            "dist/polmon-${version}-py3-none-any.whl" \
            dist/polmon-backend.service dist/SHA256SUMS.txt \
            --generate-notes --verify-tag "${notes[@]}"

  verify-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          cd published && sha256sum --check --strict SHA256SUMS.txt && ls -l
      - name: Install a display server and Qt's xcb system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libegl1 \
            libfontconfig1 libdbus-1-3
      - name: Smoke-test the published client
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: published
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%+*}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            client="./polmon-${version}-windows-x64.exe"
            launch=()
            platform=windows
          else
            tar -xzf "polmon-${version}-linux-x64.tar.gz"
            client="./polmon-${version}-linux-x64/polmon-client"
            launch=(xvfb-run -a)
            platform=xcb
          fi
          test "$("$client" --version | tr -d '\r')" = "polmon ${version}"
          "$client" --self-test | tee selftest.txt
          grep -q "self-test: PASS" selftest.txt
          "${launch[@]}" "$client" --smoke-start 3 | tee smoke.txt
          grep -q "smoke-start: PASS platform=${platform}" smoke.txt
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command \
              "Expand-Archive -Path polmon-${version}-windows-x64-portable.zip -DestinationPath portable"
            portable="portable/polmon-${version}-windows-x64-portable/polmon-client.exe"
            "$portable" --self-test | tee portable-selftest.txt
            grep -q "self-test: PASS" portable-selftest.txt
            "$portable" --smoke-start 3 | tee portable-smoke.txt
            grep -q "smoke-start: PASS platform=windows" portable-smoke.txt
          fi
          echo "Published ${RELEASE_TAG} client verified on ${RUNNER_OS} (platform ${platform})" \
            >> "$GITHUB_STEP_SUMMARY"
