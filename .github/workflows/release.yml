name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag; the executable is built from this tag
        required: true
        type: string
      pytest-deselect:
        description: Space-separated pytest node IDs to deselect on Windows (repairs only)
        required: false
        type: string
        default: ""
      notes:
        description: Text prepended to the generated release notes (explain any repair)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}
      pytest-deselect: ${{ inputs.pytest-deselect }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: polmon-windows-x64
          path: dist
      - name: Verify executable matches the tag version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%+*}"
          test -f "dist/polmon-${version}-windows-x64.exe" || {
            echo "expected dist/polmon-${version}-windows-x64.exe for ${RELEASE_TAG}"; ls -l dist; exit 1; }
          (cd dist && sha256sum ./*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create release and attach executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          notes=()
          if [[ -n "$RELEASE_NOTES" ]]; then notes=(--notes "$RELEASE_NOTES"); fi
          gh release create "$RELEASE_TAG" dist/*.exe dist/SHA256SUMS.txt \
            --generate-notes --verify-tag "${notes[@]}"
