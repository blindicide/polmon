id: l1-two-node
networks:
  - id: lab
    ipv4_subnet: 10.88.0.0/24
nodes:
  - id: client
    class: l1
    interfaces:
      - id: eth0
        network: lab
        mac: "02:00:00:88:00:01"
        ipv4: 10.88.0.10
  - id: server
    class: l1
    interfaces:
      - id: eth0
        network: lab
        mac: "02:00:00:88:00:02"
        ipv4: 10.88.0.20
    services:
      - id: web
        protocol: tcp
        port: 8080
        implementation: static_http

